- name: Installation package
  hosts: webservers
  become: true
  remote_user: master
  tasks:
  - name: creating the user in server
    ansible.builtin.user:
      name: tinku
      comment: Tinku user
      group: node1

  - name: install member
    ansible.builtin.apt:
      name: members
      state: latest

  - name: install apache2
    ansible.builtin.apt:
      name: apache2
      state: latest

